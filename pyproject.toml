[project]
name = "wordbyword"
version = "0.1.0"
description = "Extract Korean vocabulary candidates from books and documents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kiwipiepy>=0.23.1",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.2",
    "pymupdf4llm>=0.2.2",
    "python-docx>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.9.0",
]

[project.scripts]
wordbyword = "wordbyword.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py314"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
