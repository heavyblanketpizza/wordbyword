[project]
name = "wordbyword"
version = "0.1.0"
description = "Extract Korean vocabulary candidates from books and documents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kiwipiepy>=0.23.1",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.2",
    "pymupdf4llm>=0.2.2",
    "python-docx>=1.1.2",
]

[project.scripts]
wordbyword = "wordbyword.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
